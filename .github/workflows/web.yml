name: Deploy wasmapp
# Adapted from https://github.com/mathiasyde/jigsaw/blob/e065f22c8bdbc3a839ac72b79e36fa3d7d3d8f9d/.github/workflows/deploy.yml
# Accessed on 20260222
on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

# only one Pages deployment at a time, but never cancel one mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: "v0.22.1"
      - name: Add WASM build target
        run: |
          rustup target add wasm32-unknown-unknown
      # wasm-specific rustflags live in .cargo/config.toml
      - name: Run trunk build
        run: trunk build --release

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./apps/web/dist"

  deploy:
    needs: build
    # PRs only check that the site builds
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
