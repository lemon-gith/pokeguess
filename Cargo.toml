[workspace]
resolver = "3"
members = [
    "apps/web",
    "crates/shared",
    "crates/pokeapi",
    "crates/dex-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# this is the development version of Yew
yew = { git = "https://github.com/yewstack/yew/", features = ["csr"] }
