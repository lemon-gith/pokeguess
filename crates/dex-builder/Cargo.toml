[package]
name = "dex-builder"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pokeapi = { path = "../pokeapi" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "json", "rustls-tls-native-roots"] }
serde = "1"
serde_json = "1"
shared = { path = "../shared" }
